server:
  port: 8095

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true  # Ensures service IDs are lowercase for consistency

eureka:
  client:
    serviceUrl:   # Fix: `service-url` should be `serviceUrl`
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true   # Fix: Should use `registerWithEureka`
    fetchRegistry: true        # Fix: Should use `fetchRegistry`
management:
  endpoints:
    web:
      exposure:
        include: health, info

  instance:
    preferIpAddress: true  # ✅ Correct setting
