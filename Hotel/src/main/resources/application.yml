spring:
  application:
    name: Hotel
  datasource:
    url: jdbc:mysql://localhost:3306/hoteldb
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  cloud:
    config:
      enabled: false
 # config:
  #  import: optional:configserver:http://localhost:8080

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

